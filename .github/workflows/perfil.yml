name: Actualizar ficha RPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/perfil.yml
      - assets/fonts/**

permissions:
  contents: write

concurrency:
  group: ficha-rpg
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Recalcular datos públicos y dibujar la ficha
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/actualizar_perfil.py
      - name: Guardar el progreso
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg assets/progreso.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar la ficha RPG con datos públicos'
            git push
          fi
